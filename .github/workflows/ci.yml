# CI for verifier-guided-search. CI runs online; the local test suite, demo and bench run offline.
#
# Action pinning: actions are pinned to release tags and kept current by Dependabot
# (.github/dependabot.yml, github-actions ecosystem). Before this repo is published, replace each tag
# with the full commit SHA it points to and keep the tag as a trailing comment (for example with
# `pinact run`): a tag can be moved, a SHA cannot. Verify the trivy-action tag in particular.
# Container base images are pinned by digest in the Dockerfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONHASHSEED: "0"
  HYPOTHESIS_PROFILE: ci
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    name: test (pytest, coverage floor 85%)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The suite spawns a fresh interpreter per candidate program, so it is subprocess-heavy rather
      # than CPU-heavy. No API key is set: any test that reached the network would fail.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  demo:
    name: demo (offline, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # No ANTHROPIC_API_KEY in the environment: the demo must be genuinely offline.
      - run: uv run python tasks.py demo

  bench:
    name: bench (regression thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: micro-benchmarks
        run: uv run python bench/bench_baseline.py --check
      - name: evaluation (solve rates, false-pass rate, value model, escape suite)
        run: uv run python bench/bench_search.py --check
      - name: calibration (the two difficulty dials still separate the strategies)
        run: uv run python bench/bench_calibration.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore

  baseline:
    name: baseline (scripts/check_baseline.py)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --no-project python scripts/check_baseline.py

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run bandit -c pyproject.toml -r src

  semgrep:
    name: semgrep (registry + repo rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: semgrep scan
        run: >-
          uvx --from "semgrep>=1.100,<2" semgrep scan
          --config p/python
          --config p/secrets
          --config .semgrep/rules.yml
          --error --metrics off

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # tasks.py exports the locked requirements (with hashes) and applies the reviewed ignore
      # list from [tool.portfolio.audit] in pyproject.toml.
      - run: uv run --no-project python tasks.py pip-audit

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker (hadolint, build, smoke test, trivy, syft SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    env:
      IMAGE: verifier-guided-search:ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: container smoke test (HEALTHCHECK reports healthy)
        run: |
          docker run --detach --name app --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --health-interval 3s "$IMAGE"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            if [ "$status" = "healthy" ]; then
              test "$(docker inspect --format '{{.Config.User}}' app)" = "10001:10001"
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: syft CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  sandbox-escape:
    # The escape suite also runs in the ordinary test job, against the same child harness but without
    # a container. This job is the one that exercises the *boundary*: the runner as compose declares
    # it, with an internal network, a read-only rootfs, a tmpfs jail, dropped capabilities and pids,
    # memory and CPU limits. Linux only, so it cannot be part of the local Windows run.
    name: sandbox escape suite (in compose, on the real container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: docker/setup-buildx-action@v4

      - name: generate a runner key
        id: key
        run: |
          uv sync --frozen
          uv run vgs generate-api-key > key.json
          echo "raw=$(python -c 'import json;print(json.load(open("key.json"))["api_key"])')" >> "$GITHUB_OUTPUT"
          echo "digest=$(python -c 'import json;print(json.load(open("key.json"))["api_key_sha256"])')" >> "$GITHUB_OUTPUT"
          rm key.json

      - name: bring up the runner only
        env:
          APP_RUNNER_API_KEY_SHA256: ${{ steps.key.outputs.digest }}
        run: |
          docker compose up --build --detach --wait runner
          docker compose ps

      - name: assert the container really is hardened
        run: |
          set -eu
          id="$(docker compose ps -q runner)"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = "10001:10001"
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$id")" = "false"
          test "$(docker inspect -f '{{.HostConfig.PidsLimit}}' "$id")" = "64"
          # No Docker socket on any mount, and no egress route on the runner's network.
          docker inspect -f '{{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' "$id" \
            | tee /dev/stderr | grep -qv 'docker.sock'
          net="$(docker network ls --filter name=verifier --format '{{.Name}}' | head -n1)"
          test "$(docker network inspect -f '{{.Internal}}' "$net")" = "true"

      - name: run the escape suite against the containerised runner
        env:
          RUNNER_KEY: ${{ steps.key.outputs.raw }}
        run: |
          # Drive the runner from a throwaway container on the internal network, so the suite reaches
          # it the same way the search service does and the host has no route to it.
          docker compose run --rm --no-deps \
            -e APP_RUNNER_URL=http://runner:8001 \
            -e APP_RUNNER_API_KEY="$RUNNER_KEY" \
            --entrypoint python app -m verifier_guided_search.api.escape_check

      - name: runner logs
        if: always()
        run: docker compose logs runner

      - name: tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
