[project]
name = "verifier-guided-search"
version = "0.1.0"
description = "Verifier-guided tree search (MCTS/PUCT) for test-time compute scaling over candidate programs, with a hardened execution sandbox, a learned value model and budget-matched strategy comparisons."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouviere German" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core (every repo) ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # --- agentic kit ---
    "anthropic>=1.0,<2",
    # --- search, value model and the runner client ---
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "httpx>=0.27",
]

[project.scripts]
verifier-guided-search = "verifier_guided_search.cli:main"
vgs = "verifier_guided_search.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Baseline metadata consumed by scripts/check_baseline.py.
# kind: "template" (both kits), "agentic" or "ml".
[tool.portfolio]
kind = "agentic"
package = "verifier_guided_search"

# pip-audit has no native config file; tasks.py and CI read this list.
# Every entry needs a justification and a review date.
[tool.portfolio.audit]
ignore_vulns = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "PL", "TRY", "BLE", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are fine
    "PLR2004",  # magic numbers in tests and thresholds
    "TRY003",   # messages in exception constructors are fine
    # Domain exceptions are named for what happened, not for being exceptions: SandboxViolation,
    # BudgetExhausted and SandboxUnavailable read as sentences at the call site, and renaming them
    # to ...Error would make the child harness's guard harder to recognise, not easier.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S603", "S404"]
"scripts/**" = ["T201"]
"bench/**" = ["T201", "S311"]
"tasks.py" = ["T201", "S603", "S607"]
"src/verifier_guided_search/cli.py" = ["T201", "PLR0911"]  # one return per subcommand
# One return per verdict status, which is the file's whole contract; collapsing them would hide it.
"src/verifier_guided_search/sandbox/child.py" = ["T201", "PLC0415", "S102", "PLR0911"]
# One return per mutation operator, and one branch per (operator, node kind) pair.
"src/verifier_guided_search/mutate.py" = ["PLR0911"]
# The demo is a linear narrative script: its steps read better in order than split across helpers.
"src/verifier_guided_search/demo.py" = ["PLR0915"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "bench", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
# Imported lazily; type-checked when the SDK is installed (it is, via the agentic kit).
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
# scikit-learn ships no type information; only the training call site touches it.
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that wire several components (app, files, CLI) together",
    "sandbox: tests that spawn the sandbox child interpreter (slower)",
]
filterwarnings = ["error::DeprecationWarning:verifier_guided_search.*"]

[tool.coverage.run]
source = ["verifier_guided_search"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
